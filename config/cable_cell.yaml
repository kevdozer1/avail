# The cable loop testbed (S5): the plug station with 5 cables in a rack, each into its assigned port.
# Written on 2026-11-12 before any cycle ran. The stand-in System 1's failure profile below is a stand-in
# with known failure modes. It is never described as a learned policy. Its insertion mix is the one of
# config/experiment.yaml standin_s1. The probabilities were set so the truth success of an insertion's
# 1st attempt lands between 80% and 90% (standin_s1.target_first_attempt_success), on shift dev seeds only.
version: "2026-11-12"

cell:
  cables: 5                       # per cycle, into 5 distinct ports of the board's 8
  pick_speed_m_s: 0.04            # the last centimeters down to a cable and up again
  travel_speed_m_s: 0.25          # between the rack and the board
  hover_mm: 30                    # above the pre-insert height while carrying
  return_slot_speed_m_s: 0.04

failures:                         # each a probability per attempt of the step, drawn from the cycle's seed
  wrong_cable: 0.04               # pick: the arm goes to another cable still in the rack
  slip: 0.04                      # carry: the cable turns in the jaws, by a tilt drawn below, about the line between the pads
  slip_tilt_deg: [6.0, 14.0]
  drop: 0.03                      # carry: the cable leaves the jaws on the way and falls
  wrong_port: 0.012               # carry: the arm takes the cable over a free neighbor of its port. The share standin_s1's mix gives wrong_port (0.1) of a failed insertion (0.12)
  regrasp_bad_angle: 0.30         # a regrasp of a dropped cable holds it at a bad angle, drawn below
  regrasp_tilt_deg: [8.0, 20.0]
  insert: 0.108                   # insert: the attempt fails in 1 of the other ways of standin_s1.failure_mix (0.12 less the wrong-port share, which happens in the carry)
  stuck_release: 0.03             # release: the fingers do not open when told to

insert_failures:                  # what a failed insertion does, by the mix of config/experiment.yaml standin_s1
  under_push_shortfall_mm: [0.5, 4.0]     # a joint sticks and the plug stops this far from home (the zoo's N1 to N3)
  lateral_offset_mm: [0.7, 1.3]           # the plug starts this far off the port's axis and cocked (the zoo's N7)
  lateral_tilt_deg: [4.0, 8.0]
  early_release_shortfall_mm: [1.0, 4.0]  # the skill lets go this far short of home
  # wrong_port happens in the carry. unlatched: the latch is blocked (latch only, else under_push)

pull_out:                         # taking a plug back out of a bore, before a retry or in a takeover. Not a probe
  force_x_tug_cap: 2.0            # the pull may reach twice the tug probe's force cap: the tug is capped so that it never unseats a good plug, and this pull has to

teleop:                           # the person's correction when they take over (OracleHuman in sim)
  seat_force_x_insertion_peak: 1.5        # the push they seat with, the same cap as the push probe
  speed_m_s: 0.03

human_extra:                      # what OracleHuman needs beyond config/experiment.yaml human
  marks_sigma_px: 3.0             # a person's tap on the wrist image lands this close to the port center, 1 sd
  confirm_handling_s: 0.0         # a yes or no costs only the time to answer
