<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="720" height="316" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2f36"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4541a"/>
    </marker>
  </defs>

  <!-- claim -->
  <rect x="24" y="96" width="130" height="68" rx="10" fill="#f3f1ec" stroke="#2b2f36" stroke-width="1.5"/>
  <text x="89" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2f36">"done"</text>
  <text x="89" y="148" text-anchor="middle" font-size="13" fill="#555b66">robot claims a step</text>

  <line x1="154" y1="130" x2="212" y2="130" stroke="#2b2f36" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- check -->
  <rect x="214" y="80" width="180" height="100" rx="10" fill="#ffffff" stroke="#2b2f36" stroke-width="2"/>
  <text x="304" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2f36">check</text>
  <text x="304" y="134" text-anchor="middle" font-size="14" fill="#2b2f36">push · tug · look</text>
  <text x="304" y="158" text-anchor="middle" font-size="12.5" fill="#555b66">known error rate</text>

  <!-- yes -->
  <line x1="394" y1="108" x2="492" y2="64" stroke="#2b2f36" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="436" y="74" text-anchor="middle" font-size="13" fill="#2b2f36">sure</text>
  <rect x="494" y="30" width="200" height="60" rx="10" fill="#e9f2e6" stroke="#3d7a35" stroke-width="1.5"/>
  <text x="594" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5f29">next step</text>

  <!-- unsure -->
  <line x1="394" y1="152" x2="492" y2="196" stroke="#b4541a" stroke-width="1.8" marker-end="url(#b)"/>
  <text x="436" y="196" text-anchor="middle" font-size="13" fill="#b4541a">not sure</text>
  <rect x="494" y="170" width="200" height="60" rx="10" fill="#fbeee4" stroke="#b4541a" stroke-width="1.5"/>
  <text x="594" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#8f3f10">ask a person</text>

  <!-- learn loop -->
  <path d="M594 230 C594 282, 304 290, 304 182" fill="none" stroke="#b4541a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#b)"/>
  <text x="450" y="302" text-anchor="middle" font-size="13" fill="#b4541a">every answer tightens the check</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
