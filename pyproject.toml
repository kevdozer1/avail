[project]
name = "avail"
version = "0.1.0"
description = "AVAIL, Agentic Verification And Intervention Loop: a robot step is done when calibrated evidence or a person says so."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "imageio[ffmpeg]>=2.38.1",
    "matplotlib>=3.11.2",
    "mink>=1.4.0",
    "mujoco==3.13.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
avail = "avail.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long simulation checks, deselect with -m 'not slow'",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
